<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Download — ManMade Studios." />
  <meta name="robots" content="noindex" />
  <title>Download</title>
  <link rel="stylesheet" href="global.css" />
  <link rel="stylesheet" href="auth.css" />
</head>

<body>

  <main class="auth">

    <a href="index.html" class="auth__back" aria-label="Voltar">
      <img src="voltar.png" alt="" />
    </a>

    <div class="auth__background" aria-hidden="true"></div>
    <div class="auth__overlay" aria-hidden="true"></div>

    <!-- Começa só com "verificando". O conteúdo real (template abaixo) só é
         inserido por download.js depois que o login for confirmado. -->
    <section class="auth__content" id="conteudo">
      <div class="auth__card">
        <div class="auth__header">
          <span class="auth__kicker">VERIFICANDO ACESSO</span>
          <p id="status">Aguarde um instante...</p>
          <noscript><p>Ative o JavaScript para acessar esta página.</p></noscript>
        </div>
      </div>
    </section>
  </main>

  <template id="tpl-download">
    <div class="auth__card">
      <div class="auth__header">
        <span class="auth__kicker">ACESSO LIBERADO</span>
        <h1>Download</h1>
        <p>Olá, <strong data-nome></strong>! Baixe o ManMade e comece sua jornada.</p>
      </div>

      <div class="auth__form">
        <p data-mensagem class="auth__message auth__message--info" role="status" hidden></p>

        <a data-baixar class="auth__button btn btn--filled" href="#">
          <span class="icon" aria-hidden="true">
            <img src="download.png" alt="" />
          </span>
          Baixar jogo
        </a>
      </div>

      <div class="auth__footer">
        <a href="#" data-sair>Sair da conta</a>
      </div>
    </div>
  </template>

  <script type="module" src="download.js"></script>
</body>
</html>
