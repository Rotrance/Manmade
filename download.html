<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Download — ManMade Studios." />
  <title>Download</title>
  <link rel="stylesheet" href="global.css" />
  <link rel="stylesheet" href="auth.css" />
</head>

<!-- "is-checking" esconde o conteúdo até o login ser confirmado (download.js) -->
<body class="is-checking">

  <main class="auth">

    <a href="index.html" class="auth__back" aria-label="Voltar">
      <img src="voltar.png" alt="" />
    </a>

    <div class="auth__background" aria-hidden="true"></div>
    <div class="auth__overlay" aria-hidden="true"></div>

    <section class="auth__content">
      <div class="auth__card">

        <div class="auth__header">
          <span class="auth__kicker">ACESSO LIBERADO</span>
          <h1>Download</h1>
          <p>Olá, <strong id="nome-usuario"></strong>! Baixe o ManMade e comece sua jornada.</p>
        </div>

        <div class="auth__form">
          <p id="mensagem" class="auth__message auth__message--info" role="status" hidden></p>

          <a id="btn-baixar" class="auth__button btn btn--filled" href="#">
            <span class="icon" aria-hidden="true">
              <img src="download.png" alt="" />
            </span>
            Baixar jogo
          </a>
        </div>

        <div class="auth__footer">
          <a href="#" id="btn-sair">Sair da conta</a>
        </div>

      </div>
    </section>
  </main>

  <script type="module" src="download.js"></script>
</body>
</html>
