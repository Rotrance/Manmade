<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="ManMade Studios — jogo de ambientação imersiva em diferentes épocas." />
  <title>ManMade</title>
  <link rel="stylesheet" href="global.css" />
  <link rel="stylesheet" href="home.css" />
</head>

<body>

  <header class="site-header">
    <!-- Preenchido por home.js (Cadastrar/Entrar ou usuário logado) -->
    <nav class="site-nav" id="site-nav" aria-label="Navegação principal">
      <a class="btn btn--filled btn--small" href="cadastro.html">
        <span class="icon" aria-hidden="true"><img src="cadastro.png" alt="" /></span>
        Cadastrar
      </a>
      <a class="btn btn--outline btn--small" href="login.html">
        <span class="icon" aria-hidden="true"><img src="login.png" alt="" /></span>
        Entrar
      </a>
    </nav>
  </header>

  <main>

    <section id="download" class="hero">
      <div class="hero__photo" aria-hidden="true"></div>
      <div class="hero__overlay" aria-hidden="true"></div>

      <div class="hero__content container">
        <div class="hero__brandline">
          <span>MANMADE STUDIOS</span>
        </div>

        <h1>Man<span>Made</span></h1>

        <p class="hero__subtitle">
          Um jogo de ambientação imersiva em<br />
          diferentes épocas.
        </p>

        <a id="btn-download" class="btn btn--filled btn--download" href="download.html">
          <span class="icon" aria-hidden="true">
            <img src="download.png" alt="" />
          </span>
          DOWNLOAD GRÁTIS
        </a>
      </div>
    </section>

    <section id="pesquisa" class="survey">
      <div class="survey__inner container">
        <div class="section-kicker">
          <span>SUA OPINIÃO</span>
        </div>

        <h2>Ajude a construir o ManMade</h2>

        <p class="survey__description">
          Responda ao nosso formulário e conte o que você achou do jogo.
          Suas respostas ajudam a moldar as próximas atualizações.
        </p>

        <a
          class="btn btn--filled btn--survey"
          href="https://forms.gle/JHFngoNWLSseCXTH9"
          target="_blank"
          rel="noopener noreferrer"
        >
          RESPONDER FORMULÁRIO
          <span aria-hidden="true">→</span>
        </a>
      </div>
    </section>
  </main>

  <script type="module" src="home.js"></script>
</body>
</html>
