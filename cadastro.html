<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Cadastro — ManMade Studios." />
  <title>Cadastrar</title>
  <link rel="stylesheet" href="global.css" />
  <link rel="stylesheet" href="auth.css" />
</head>

<body>

  <main class="auth">

    <a href="index.html" class="auth__back" aria-label="Voltar">
      <img src="voltar.png" alt="" />
    </a>

    <div class="auth__background" aria-hidden="true"></div>
    <div class="auth__overlay" aria-hidden="true"></div>

    <section class="auth__content">
      <div class="auth__card">

        <div class="auth__header">
          <span class="auth__kicker">CRIE SUA CONTA</span>
          <h1>Cadastrar</h1>
          <p>Crie sua conta para começar sua jornada.</p>
        </div>

        <form class="auth__form" data-auth="cadastro" novalidate>

          <p id="mensagem" class="auth__message" role="alert" hidden></p>

          <div class="form-group">
            <label for="nome">Nome</label>
            <input type="text" id="nome" name="nome" placeholder="Digite seu nome" autocomplete="name" required />
          </div>

          <div class="form-group">
            <label for="email">E-mail</label>
            <input type="email" id="email" name="email" placeholder="Digite seu e-mail" autocomplete="email" required />
          </div>

          <div class="form-group">
            <label for="senha">Senha</label>
            <input type="password" id="senha" name="senha" placeholder="Mínimo de 6 caracteres" autocomplete="new-password" required />
          </div>

          <div class="form-group">
            <label for="confirmar-senha">Confirmar senha</label>
            <input type="password" id="confirmar-senha" name="confirmar-senha" placeholder="Confirme sua senha" autocomplete="new-password" required />
          </div>

          <button type="submit" class="auth__button btn btn--filled">Cadastrar</button>
        </form>

        <div class="auth__footer">
          <span>Já possui uma conta?</span>
          <a href="login.html">Entrar</a>
        </div>

      </div>
    </section>
  </main>

  
  <script type="module" src="auth-pages.js"></script>
</body>
</html>
